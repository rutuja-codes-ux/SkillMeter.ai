# Render Blueprint Specification for SkillForge.ai
# Use this file to deploy the entire backend stack (Python Web Service + PostgreSQL database) automatically.

services:
  - type: web
    name: skillforge-backend
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillforge-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_CORS_ALLOW_ALL
        value: "True"
      - key: GEMINI_API_KEY
        sync: false


databases:
  - name: skillforge-db
    plan: free
